services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: material_master
      POSTGRES_USER: material
      POSTGRES_PASSWORD: material
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U material -d material_master"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://material:material@db:5432/material_master
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
